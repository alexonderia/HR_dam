services:
  frontend:
    container_name: hr_dam-frontend
    image: hr-dam-frontend:local
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:8080"
    networks: [infrastructure]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    container_name: hr_dam-backend
    image: hr-dam-backend:local
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment: &application-environment
      PORT: 3001
      PGHOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      S3_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      CLAMAV_HOST: clamav
      RESUME_ANALYZER_URL: ${RESUME_ANALYZER_URL:-http://resume-analyzer:8000/rank}
      RESUME_ANALYZER_READY_URL: ${RESUME_ANALYZER_READY_URL:-}
      RESUME_ANALYZER_TIMEOUT_MS: ${RESUME_ANALYZER_TIMEOUT_MS:-900000}
      WORKER_HEALTH_URL: http://worker:3003/health
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-false}
      RANK_BRIDGE_ENABLED: ${RANK_BRIDGE_ENABLED:-true}
      RABBITMQ_USER: ${RABBITMQ_USER:-hr_dam}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      RABBITMQ_VHOST: /
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RESUME_ANALYZER_CALLBACK_TOKEN: ${RESUME_ANALYZER_CALLBACK_TOKEN:-}
      RESUME_SPOOL_DIR: /var/lib/hr-dam/resume-spool
      QUEUE_RETRY_DELAY_MS: ${QUEUE_RETRY_DELAY_MS:-10000}
    volumes:
      - resume_spool:/var/lib/hr-dam/resume-spool
    expose: ["3001"]
    networks: [infrastructure]
    depends_on: &application-dependencies
      flyway:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  worker:
    container_name: hr_dam-worker
    image: hr-dam-worker:local
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *application-environment
      ANALYSIS_MAX_RETRIES: ${ANALYSIS_MAX_RETRIES:-2}
      ANALYSIS_RETRY_DELAY_MS: ${ANALYSIS_RETRY_DELAY_MS:-15000}
    expose: ["3003"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [infrastructure]
    volumes:
      - resume_spool:/var/lib/hr-dam/resume-spool
    depends_on: *application-dependencies
    restart: unless-stopped

  resume-analyzer:
    container_name: hr_dam-resume-analyzer
    image: hr-dam-resume-analyzer:local
    build:
      context: ./apps/resume-analyzer
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b-q4_K_M}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      RANK_TIMEOUT_SECONDS: ${RANK_TIMEOUT_SECONDS:-840}
      MODEL_PROBE_TIMEOUT_SECONDS: ${MODEL_PROBE_TIMEOUT_SECONDS:-60}
      MODEL_PROBE_INTERVAL_SECONDS: ${MODEL_PROBE_INTERVAL_SECONDS:-15}
      LOG_DIR: /app/logs
      DIAGNOSTIC_LOGS_ENABLED: ${DIAGNOSTIC_LOGS_ENABLED:-true}
      DIAGNOSTIC_RETENTION_DAYS: ${DIAGNOSTIC_RETENTION_DAYS:-3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose: ["8000"]
    networks: [infrastructure]
    volumes:
      - ./logs/resume-analyzer:/app/logs
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Model download/readiness is independent of API and frontend startup.
  ollama:
    container_name: hr_dam-ollama
    image: &ollama-image ollama/ollama:0.40.3
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "16384"
      LLAMA_ARG_CACHE_RAM: ${OLLAMA_PROMPT_CACHE_MB:-1024}
    expose: ["11434"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    networks: [infrastructure]
    healthcheck:
      test: [CMD-SHELL, "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  ollama-init:
    container_name: hr_dam-ollama-init
    image: *ollama-image
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b-q4_K_M}
    entrypoint: [/bin/sh, /init/model.sh]
    volumes:
      - ./infra/ollama/model.sh:/init/model.sh:ro
    networks: [infrastructure]
    depends_on:
      ollama:
        condition: service_healthy
    restart: on-failure

  clamav:
    container_name: hr_dam-clamav
    image: clamav/clamav:stable
    volumes:
      - clamav_data:/var/lib/clamav
    networks: [infrastructure]
    healthcheck:
      test: [CMD, clamdscan, --ping, "3"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  rabbitmq:
    profiles: [broker]
    container_name: hr_dam-rabbitmq
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hr_dam}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [infrastructure]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    container_name: hr_dam-postgres
    image: postgres:16.13-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [infrastructure]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  pgadmin:
    container_name: hr_dam-pgadmin
    image: dpage/pgadmin4:9.18
    entrypoint: [/bin/sh, /config/start.sh]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/start.sh:/config/start.sh:ro
    networks: [infrastructure]
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          /venv/bin/python3,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping', timeout=5)",
        ]
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  flyway:
    container_name: hr_dam-flyway
    image: flyway/flyway:12.1.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      FLYWAY_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      REDGATE_DISABLE_TELEMETRY: "true"
    volumes:
      - ./db/migrations:/flyway/sql:ro
    networks: [infrastructure]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seaweedfs:
    container_name: hr_dam-seaweedfs
    image: chrislusf/seaweedfs:4.29
    command:
      - server
      - -dir=/data
      - -master.dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=1024
      - -volume.max=8
      - -filer
      - -s3
      - -s3.port=8333
      - -s3.iam=false
      - -s3.port.iceberg=0
      - -s3.allowDeleteBucketNotEmpty=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
      - ./infra/seaweedfs/filer.toml:/etc/seaweedfs/filer.toml:ro
    networks: [infrastructure]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:9333/cluster/status &&
          wget -q -O /dev/null http://127.0.0.1:8888/ &&
          wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/1.1 403'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  s3-init:
    container_name: hr_dam-s3-init
    image: amazon/aws-cli:2.27.49
    entrypoint: [/bin/sh, /init/bucket.sh]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      S3_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://seaweedfs:8333}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
    volumes:
      - ./infra/s3/bucket.sh:/init/bucket.sh:ro
    networks: [infrastructure]
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

networks:
  infrastructure:

volumes:
  rabbitmq_data:
  resume_spool:
  clamav_data:
  postgres_data:
  seaweedfs_data:
  pgadmin_data:
  ollama_data:
