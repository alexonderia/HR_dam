services:
  postgres:
    container_name: hr_dam-postgres
    image: postgres:16.13-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [infrastructure]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  pgadmin:
    container_name: hr_dam-pgadmin
    image: dpage/pgadmin4:9.18
    entrypoint: [/bin/sh, /config/start.sh]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/start.sh:/config/start.sh:ro
    networks: [infrastructure]
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /venv/bin/python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  flyway:
    container_name: hr_dam-flyway
    image: flyway/flyway:12.1.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      FLYWAY_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      REDGATE_DISABLE_TELEMETRY: "true"
    volumes:
      - ./db/migrations:/flyway/sql:ro
    networks: [infrastructure]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seaweedfs:
    container_name: hr_dam-seaweedfs
    image: chrislusf/seaweedfs:4.29
    command:
      - server
      - -dir=/data
      - -master.dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=1024
      - -volume.max=8
      - -filer
      - -s3
      - -s3.port=8333
      - -s3.iam=false
      - -s3.port.iceberg=0
      - -s3.allowDeleteBucketNotEmpty=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
      - ./infra/seaweedfs/filer.toml:/etc/seaweedfs/filer.toml:ro
    networks: [infrastructure]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:9333/cluster/status &&
          wget -q -O /dev/null http://127.0.0.1:8888/ &&
          wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/1.1 403'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  s3-init:
    container_name: hr_dam-s3-init
    image: amazon/aws-cli:2.27.49
    entrypoint: [/bin/sh, /init/bucket.sh]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      S3_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://seaweedfs:8333}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
    volumes:
      - ./infra/s3/bucket.sh:/init/bucket.sh:ro
    networks: [infrastructure]
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

networks:
  infrastructure:

volumes:
  postgres_data:
  seaweedfs_data:
  pgadmin_data:
