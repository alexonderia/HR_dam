services:
  frontend:
    container_name: hr_dam-frontend
    image: hr-dam-frontend:local
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment: &id001
      TZ: Europe/Moscow
    ports:
    - ${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:8080
    networks:
    - edge
    - frontend-guest
    - frontend-app
    - frontend-auth
    restart: unless-stopped
  auth-check:
    image: hr-dam-auth-check:local
    build:
      context: .
      dockerfile: infra/node/Dockerfile
      args:
        SERVICE: auth-check
    environment:
      TZ: Europe/Moscow
      PORT: 3004
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      AUTH_PUBLIC_KEY_FILE: /run/secrets/auth-public
    expose:
    - '3004'
    networks:
    - frontend-auth
    secrets:
    - auth-public
    tmpfs:
    - /tmp:size=512m,mode=1777
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3004/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
  guest-api:
    image: hr-dam-guest-api:local
    build:
      context: .
      dockerfile: infra/node/Dockerfile
      args:
        SERVICE: guest-api
    environment:
      TZ: Europe/Moscow
      PORT: 3002
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      GUEST_S3_ENDPOINT: http://seaweedfs:8333
      GUEST_S3_REGION: ${S3_REGION:-us-east-1}
      GUEST_S3_ACCESS_KEY: ${GUEST_S3_ACCESS_KEY:?Run npm run prepare:environment}
      GUEST_S3_SECRET_KEY: ${GUEST_S3_SECRET_KEY:?Run npm run prepare:environment}
      PROCESSING_AMQP_URL: amqp://hr_guest:${GUEST_AMQP_PASSWORD:?Run npm run prepare:environment}@rabbitmq:5672/hr-guest
      CLAMAV_HOST: clamav
      AUTH_PUBLIC_KEY_FILE: /run/secrets/auth-public
      GUEST_JOB_PRIVATE_KEY_FILE: /run/secrets/guest-job-private
      GUEST_JOB_PUBLIC_KEY_FILE: /run/secrets/guest-job-public
      GUEST_COOKIE_PRIVATE_KEY_FILE: /run/secrets/guest-cookie-private
      GUEST_COOKIE_PUBLIC_KEY_FILE: /run/secrets/guest-cookie-public
      PROCESSING_TIMEOUT_MS: ${PROCESSING_TIMEOUT_MS:-1800000}
      UPLOAD_TIMEOUT_MS: ${UPLOAD_TIMEOUT_MS:-600000}
      GUEST_UPLOAD_CONCURRENCY: ${GUEST_UPLOAD_CONCURRENCY:-3}
      GUEST_ABSOLUTE_TTL_MS: ${GUEST_ABSOLUTE_TTL_MS:-86400000}
      GUEST_RESULT_TTL_MS: ${GUEST_RESULT_TTL_MS:-7200000}
    expose:
    - '3002'
    networks:
    - frontend-guest
    - guest-store
    - guest-broker
    - guest-jobs
    - guest-antivirus
    secrets:
    - auth-public
    - guest-job-private
    - guest-job-public
    - guest-cookie-private
    - guest-cookie-public
    tmpfs:
    - /tmp:size=512m,mode=1777
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    depends_on:
      s3-init:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully
  backend:
    image: hr-dam-backend:local
    build:
      context: .
      dockerfile: infra/node/Dockerfile
      args:
        SERVICE: backend
    environment:
      TZ: Europe/Moscow
      PORT: 3001
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      PGHOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      S3_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      CLAMAV_HOST: clamav
      RESUME_ANALYZER_URL: ${RESUME_ANALYZER_URL:-http://resume-analyzer:8000/rank}
      RESUME_ANALYZER_READY_URL: ${RESUME_ANALYZER_READY_URL:-}
      RESUME_ANALYZER_CONTACTS_URL: ${RESUME_ANALYZER_CONTACTS_URL:-}
      RESUME_ANALYZER_TIMEOUT_MS: ${RESUME_ANALYZER_TIMEOUT_MS:-900000}
      WORKER_HEALTH_URL: http://worker:3003/health
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-false}
      ANALYZER_ADAPTER: ${ANALYZER_ADAPTER:-http}
      RANK_BRIDGE_ENABLED: ${RANK_BRIDGE_ENABLED:-true}
      RABBITMQ_USER: ${RABBITMQ_USER:-hr_dam}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      RABBITMQ_VHOST: /
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RESUME_ANALYZER_CALLBACK_TOKEN: ${RESUME_ANALYZER_CALLBACK_TOKEN:-}
      RESUME_SPOOL_DIR: /var/lib/hr-dam/resume-spool
      QUEUE_RETRY_DELAY_MS: ${QUEUE_RETRY_DELAY_MS:-10000}
    volumes:
      - resume_spool:/var/lib/hr-dam/resume-spool
    expose: ["3001"]
    networks: [infrastructure]
    depends_on: &application-dependencies
      flyway:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  worker:
    container_name: hr_dam-worker
    image: hr-dam-worker:local
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *application-environment
      ANALYSIS_MAX_RETRIES: ${ANALYSIS_MAX_RETRIES:-2}
      ANALYSIS_RETRY_DELAY_MS: ${ANALYSIS_RETRY_DELAY_MS:-15000}
    expose: ["3003"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [infrastructure]
    volumes:
      - resume_spool:/var/lib/hr-dam/resume-spool
    depends_on: *application-dependencies
    restart: unless-stopped

  resume-analyzer:
    container_name: hr_dam-resume-analyzer
    image: hr-dam-resume-analyzer:local
    build:
      context: ./apps/resume-analyzer
    environment:
      <<: *moscow-environment
      ANALYZER_ADAPTER: ${ANALYZER_ADAPTER:-http}
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-false}
      RANK_BRIDGE_ENABLED: ${RANK_BRIDGE_ENABLED:-true}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-hr_dam}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      RABBITMQ_VHOST: /
      BACKEND_BASE_URL: http://backend:3001
      RESUME_ANALYZER_CALLBACK_TOKEN: ${RESUME_ANALYZER_CALLBACK_TOKEN:-}
      SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-210}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      RANK_TIMEOUT_SECONDS: ${RANK_TIMEOUT_SECONDS:-840}
      MODEL_PROBE_TIMEOUT_SECONDS: ${MODEL_PROBE_TIMEOUT_SECONDS:-10}
      MODEL_PROBE_INTERVAL_SECONDS: ${MODEL_PROBE_INTERVAL_SECONDS:-15}
      LOG_DIR: /app/logs
      DIAGNOSTIC_LOGS_ENABLED: ${DIAGNOSTIC_LOGS_ENABLED:-true}
      DIAGNOSTIC_RETENTION_DAYS: ${DIAGNOSTIC_RETENTION_DAYS:-3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose: ["8000"]
    networks: [infrastructure]
    volumes:
      - ./logs/resume-analyzer:/app/logs
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    stop_grace_period: 240s
    restart: unless-stopped

  # Model download/readiness is independent of API and frontend startup.
  ollama:
    container_name: hr_dam-ollama
    image: &ollama-image hr-dam-ollama:local
    build:
      context: .
      dockerfile: infra/ollama/Dockerfile
    environment:
      <<: *moscow-environment
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "16384"
      LLAMA_ARG_CACHE_RAM: ${OLLAMA_PROMPT_CACHE_MB:-1024}
    expose: ["11434"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    networks: [infrastructure]
    healthcheck:
      test: [CMD-SHELL, "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  ollama-init:
    container_name: hr_dam-ollama-init
    image: *ollama-image
    pull_policy: never
    environment:
      <<: *moscow-environment
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
    entrypoint: [/bin/sh, /init/model.sh]
    volumes:
      - ./infra/ollama/model.sh:/init/model.sh:ro
    networks: [infrastructure]
    depends_on:
      ollama:
        condition: service_healthy
    restart: on-failure

  clamav:
    container_name: hr_dam-clamav
    image: clamav/clamav:stable
    environment: *moscow-environment
    volumes:
      - clamav_data:/var/lib/clamav
    networks: [infrastructure]
    healthcheck:
      test: [CMD, clamdscan, --ping, "3"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  rabbitmq:
    container_name: hr_dam-rabbitmq
    hostname: ${RABBITMQ_NODE_HOSTNAME:-rabbitmq}
    image: rabbitmq:4.3.6-management-alpine
    environment:
      TZ: Europe/Moscow
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER:?Run npm run prepare:environment}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?Run npm run prepare:environment}
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    networks:
    - guest-broker
    - authorized-broker
    - processor-broker
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  rabbitmq-init:
    image: node:24-bookworm-slim
    entrypoint:
    - node
    - /init/init.mjs
    environment:
      TZ: Europe/Moscow
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_ADMIN_USER: ${RABBITMQ_ADMIN_USER:?Run npm run prepare:environment}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:?Run npm run prepare:environment}
      GUEST_AMQP_PASSWORD: ${GUEST_AMQP_PASSWORD:?Run npm run prepare:environment}
      AUTHORIZED_AMQP_PASSWORD: ${AUTHORIZED_AMQP_PASSWORD:?Run npm run prepare:environment}
      PREPARE_AMQP_PASSWORD: ${PREPARE_AMQP_PASSWORD:?Run npm run prepare:environment}
      EVALUATE_AMQP_PASSWORD: ${EVALUATE_AMQP_PASSWORD:?Run npm run prepare:environment}
    volumes:
    - ./infra/rabbitmq/init.mjs:/init/init.mjs:ro
    networks:
    - processor-broker
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: 'no'
  resume-parser:
    profiles:
    - processing
    image: ${PREPARE_IMAGE:-hr-dam-resume-parser:local}
    environment:
      TZ: Europe/Moscow
      PORT: 8001
      GUEST_AMQP_URL: amqp://hr_prepare:${PREPARE_AMQP_PASSWORD:?Run npm run prepare:environment}@rabbitmq:5672/hr-guest
      AUTHORIZED_AMQP_URL: amqp://hr_prepare:${PREPARE_AMQP_PASSWORD:?Run npm run
        prepare:environment}@rabbitmq:5672/hr-authorized
      GUEST_API_BASE_URL: http://guest-api:3002/internal/guest
      AUTHORIZED_API_BASE_URL: http://backend:3001/internal/app
      GUEST_JOB_PUBLIC_KEY_FILE: /run/secrets/guest-job-public
      AUTHORIZED_JOB_PUBLIC_KEY_FILE: /run/secrets/authorized-job-public
    secrets:
    - guest-job-public
    - authorized-job-public
    networks:
    - guest-jobs
    - authorized-jobs
    - processor-broker
    - model
    tmpfs:
    - /tmp:size=512m,mode=1777
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
    restart: unless-stopped
  resume-evaluator:
    profiles:
    - processing
    image: ${EVALUATE_IMAGE:-hr-dam-resume-evaluator:local}
    environment:
      TZ: Europe/Moscow
      PORT: 8002
      GUEST_AMQP_URL: amqp://hr_evaluate:${EVALUATE_AMQP_PASSWORD:?Run npm run prepare:environment}@rabbitmq:5672/hr-guest
      AUTHORIZED_AMQP_URL: amqp://hr_evaluate:${EVALUATE_AMQP_PASSWORD:?Run npm run
        prepare:environment}@rabbitmq:5672/hr-authorized
      GUEST_API_BASE_URL: http://guest-api:3002/internal/guest
      AUTHORIZED_API_BASE_URL: http://backend:3001/internal/app
      GUEST_JOB_PUBLIC_KEY_FILE: /run/secrets/guest-job-public
      AUTHORIZED_JOB_PUBLIC_KEY_FILE: /run/secrets/authorized-job-public
    secrets:
    - guest-job-public
    - authorized-job-public
    networks:
    - guest-jobs
    - authorized-jobs
    - processor-broker
    - model
    tmpfs:
    - /tmp:size=512m,mode=1777
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
    restart: unless-stopped
  postgres:
    container_name: hr_dam-postgres
    image: postgres:16.13-alpine3.23
    command:
    - postgres
    - -c
    - timezone=Europe/Moscow
    - -c
    - log_timezone=Europe/Moscow
    environment:
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
    - database
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
  flyway:
    container_name: hr_dam-flyway
    image: flyway/flyway:12.1.0
    command: migrate
    environment:
      TZ: Europe/Moscow
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in
        .env}
      FLYWAY_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CLEAN_DISABLED: 'true'
      FLYWAY_BASELINE_ON_MIGRATE: 'false'
      FLYWAY_VALIDATE_MIGRATION_NAMING: 'true'
      REDGATE_DISABLE_TELEMETRY: 'true'
    volumes:
    - ./db/migrations:/flyway/sql:ro
    networks:
    - database
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  seaweedfs:
    container_name: hr_dam-seaweedfs
    image: hr-dam-seaweedfs:local
    build:
      context: .
      dockerfile: infra/seaweedfs/Dockerfile
    command:
    - server
    - -dir=/data
    - -master.dir=/data
    - -ip=seaweedfs
    - -ip.bind=0.0.0.0
    - -master.volumeSizeLimitMB=1024
    - -volume.max=32
    - -filer
    - -s3
    - -s3.port=8333
    - -s3.iam=false
    - -s3.port.iceberg=0
    - -s3.allowDeleteBucketNotEmpty=false
    - -s3.config=/run/secrets/seaweed-s3
    environment:
      TZ: Europe/Moscow
    volumes:
    - seaweedfs_data:/data
    - ./infra/seaweedfs/filer.toml:/etc/seaweedfs/filer.toml:ro
    networks:
    - guest-store
    - authorized-store
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null
        http://127.0.0.1:8888/ && wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1
        | grep -q 'HTTP/1.1 403'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    secrets:
    - seaweed-s3
  s3-init:
    container_name: hr_dam-s3-init
    image: amazon/aws-cli:2.27.49
    entrypoint:
    - /bin/sh
    - /init/bucket.sh
    environment:
      TZ: Europe/Moscow
      AWS_ACCESS_KEY_ID: ${S3_INIT_ACCESS_KEY:?Run npm run prepare:environment}
      AWS_SECRET_ACCESS_KEY: ${S3_INIT_SECRET_KEY:?Run npm run prepare:environment}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_PAGER: ''
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      S3_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://seaweedfs:8333}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
    volumes:
    - ./infra/s3/bucket.sh:/init/bucket.sh:ro
    networks:
    - guest-store
    - authorized-store
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: 'no'
  clamav:
    container_name: hr_dam-clamav
    image: clamav/clamav:stable
    environment: *id001
    volumes:
    - clamav_data:/var/lib/clamav
    networks:
    - guest-antivirus
    - authorized-antivirus
    healthcheck:
      test:
      - CMD
      - clamdscan
      - --ping
      - '3'
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped
  pgadmin:
    container_name: hr_dam-pgadmin
    image: dpage/pgadmin4:9.18
    entrypoint:
    - /bin/sh
    - /config/start.sh
    environment:
      TZ: Europe/Moscow
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      PGADMIN_DISABLE_POSTFIX: 'true'
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    ports:
    - ${BIND_ADDRESS:-127.0.0.1}:${PGADMIN_PORT:-5050}:80
    volumes:
    - pgadmin_data:/var/lib/pgadmin
    - ./infra/pgadmin/start.sh:/config/start.sh:ro
    networks:
    - database
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - /venv/bin/python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping',
        timeout=5)
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    profiles:
    - administration
  ollama:
    container_name: hr_dam-ollama
    image: hr-dam-ollama:local
    build:
      context: .
      dockerfile: infra/ollama/Dockerfile
    environment:
      TZ: Europe/Moscow
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '16384'
      LLAMA_ARG_CACHE_RAM: ${OLLAMA_PROMPT_CACHE_MB:-1024}
    expose:
    - '11434'
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    volumes:
    - ollama_data:/root/.ollama
    networks:
    - model
    healthcheck:
      test:
      - CMD-SHELL
      - OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    profiles:
    - docker-ollama
  ollama-init:
    container_name: hr_dam-ollama-init
    image: hr-dam-ollama:local
    pull_policy: never
    environment:
      TZ: Europe/Moscow
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b-q4_K_M}
    entrypoint:
    - /bin/sh
    - /init/model.sh
    volumes:
    - ./infra/ollama/model.sh:/init/model.sh:ro
    networks:
    - model
    depends_on:
      ollama:
        condition: service_healthy
    restart: on-failure
    profiles:
    - docker-ollama
networks:
  frontend-guest:
    internal: true
  frontend-app:
    internal: true
  frontend-auth:
    internal: true
  database:
    internal: true
  guest-store:
    internal: true
  authorized-store:
    internal: true
