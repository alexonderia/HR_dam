# Общие настройки; сети и ключи каждого контура указаны в его сервисе.
# Необязательные профили: processing, administration, docker-ollama.
x-timezone: &timezone {TZ: Europe/Moscow}
x-service: &service {environment: *timezone, restart: unless-stopped}
x-node-build: &node-build {context: ., dockerfile: infra/node/Dockerfile}
x-node: &node {<<: *service, tmpfs: ['/tmp:size=512m,mode=1777']}
x-health: &health {interval: 10s, timeout: 5s, retries: 10, start_period: 15s}
x-api-env: &api-env
  <<: *timezone
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  AUTH_PUBLIC_KEY_FILE: /run/secrets/auth-public
x-api-ready: &api-ready
  s3-init: {condition: service_completed_successfully}
  rabbitmq-init: {condition: service_completed_successfully}
x-processor: &processor
  <<: *node
  profiles: [processing]
  environment: &processor-env
    <<: *timezone
    GUEST_API_BASE_URL: http://guest-api:3002/internal/guest
    AUTHORIZED_API_BASE_URL: http://backend:3001/internal/app
    GUEST_JOB_PUBLIC_KEY_FILE: /run/secrets/guest-job-public
    AUTHORIZED_JOB_PUBLIC_KEY_FILE: /run/secrets/authorized-job-public
  secrets: [guest-job-public, authorized-job-public]
  networks: [guest-jobs, authorized-jobs, processor-broker, model]
  depends_on: {rabbitmq-init: {condition: service_completed_successfully}}

services:
  frontend:
    <<: *service
    container_name: hr_dam-frontend
    image: hr-dam-frontend:local
    build: {context: ., dockerfile: apps/frontend/Dockerfile}
    ports: ['${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:8080']
    networks: [edge, frontend-guest, frontend-app, frontend-auth]
  auth-check:
    <<: *node
    image: hr-dam-auth-check:local
    build: {<<: *node-build, args: {SERVICE: auth-check}}
    environment:
      <<: *api-env
      PORT: 3004
    expose: ['3004']
    networks: [frontend-auth]
    secrets: [auth-public]
    healthcheck:
      <<: *health
      test: [CMD, node, -e, 'fetch(''http://127.0.0.1:3004/health'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      start_period: 20s
  guest-api:
    <<: *node
    image: hr-dam-guest-api:local
    build: {<<: *node-build, args: {SERVICE: guest-api}}
    environment:
      <<: *api-env
      PORT: 3002
      GUEST_S3_ENDPOINT: http://seaweedfs:8333
      GUEST_S3_REGION: ${S3_REGION:-us-east-1}
      GUEST_S3_ACCESS_KEY: ${GUEST_S3_ACCESS_KEY:?Run npm run prepare:environment}
      GUEST_S3_SECRET_KEY: ${GUEST_S3_SECRET_KEY:?Run npm run prepare:environment}
      PROCESSING_AMQP_URL: amqp://hr_guest:${GUEST_AMQP_PASSWORD:?Run npm run prepare:environment}@rabbitmq:5672/hr-guest
      CLAMAV_HOST: clamav
      GUEST_JOB_PRIVATE_KEY_FILE: /run/secrets/guest-job-private
      GUEST_JOB_PUBLIC_KEY_FILE: /run/secrets/guest-job-public
      GUEST_COOKIE_PRIVATE_KEY_FILE: /run/secrets/guest-cookie-private
      GUEST_COOKIE_PUBLIC_KEY_FILE: /run/secrets/guest-cookie-public
      PROCESSING_TIMEOUT_MS: ${PROCESSING_TIMEOUT_MS:-1800000}
      UPLOAD_TIMEOUT_MS: ${UPLOAD_TIMEOUT_MS:-600000}
      GUEST_UPLOAD_CONCURRENCY: ${GUEST_UPLOAD_CONCURRENCY:-3}
      GUEST_ABSOLUTE_TTL_MS: ${GUEST_ABSOLUTE_TTL_MS:-86400000}
      GUEST_RESULT_TTL_MS: ${GUEST_RESULT_TTL_MS:-7200000}
    expose: ['3002']
    networks: [frontend-guest, guest-store, guest-broker, guest-jobs, guest-antivirus]
    secrets: [auth-public, guest-job-private, guest-job-public, guest-cookie-private, guest-cookie-public]
    healthcheck:
      <<: *health
      test: [CMD, node, -e, 'fetch(''http://127.0.0.1:3002/health'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      start_period: 20s
    depends_on: *api-ready
  backend:
    <<: *node
    image: hr-dam-backend:local
    build: {<<: *node-build, args: {SERVICE: backend}}
    environment:
      <<: *api-env
      PORT: 3001
      PGHOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      S3_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      CLAMAV_HOST: clamav
      PROCESSING_AMQP_URL: amqp://hr_authorized:${AUTHORIZED_AMQP_PASSWORD:?Run npm run prepare:environment}@rabbitmq:5672/hr-authorized
      PROCESSING_MANAGEMENT_URL: http://rabbitmq:15672
      AUTH_PRIVATE_KEY_FILE: /run/secrets/auth-private
      AUTHORIZED_JOB_PRIVATE_KEY_FILE: /run/secrets/authorized-job-private
      AUTHORIZED_JOB_PUBLIC_KEY_FILE: /run/secrets/authorized-job-public
      PROCESSING_TIMEOUT_MS: ${PROCESSING_TIMEOUT_MS:-1800000}
      UPLOAD_TIMEOUT_MS: ${UPLOAD_TIMEOUT_MS:-600000}
    expose: ['3001']
    networks: [frontend-app, database, authorized-store, authorized-broker, authorized-jobs, authorized-antivirus]
    secrets: [auth-private, auth-public, authorized-job-private, authorized-job-public]
    healthcheck:
      <<: *health
      test: [CMD, node, -e, 'fetch(''http://127.0.0.1:3001/health'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      start_period: 20s
    depends_on: {<<: *api-ready, flyway: {condition: service_completed_successfully}}
  rabbitmq:
    <<: *service
    container_name: hr_dam-rabbitmq
    hostname: ${RABBITMQ_NODE_HOSTNAME:-rabbitmq}
    image: rabbitmq:4.3.6-management-alpine
    environment:
      <<: *timezone
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER:?Run npm run prepare:environment}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?Run npm run prepare:environment}
    volumes: ['rabbitmq_data:/var/lib/rabbitmq']
    networks: [guest-broker, authorized-broker, processor-broker]
    healthcheck:
      <<: *health
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      retries: 12
      start_period: 20s
  rabbitmq-init:
    <<: *service
    image: node:24-bookworm-slim
    entrypoint: [node, /init/init.mjs]
    environment:
      <<: *timezone
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_ADMIN_USER: ${RABBITMQ_ADMIN_USER:?Run npm run prepare:environment}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:?Run npm run prepare:environment}
      GUEST_AMQP_PASSWORD: ${GUEST_AMQP_PASSWORD:?Run npm run prepare:environment}
      AUTHORIZED_AMQP_PASSWORD: ${AUTHORIZED_AMQP_PASSWORD:?Run npm run prepare:environment}
      PREPARE_AMQP_PASSWORD: ${PREPARE_AMQP_PASSWORD:?Run npm run prepare:environment}
      EVALUATE_AMQP_PASSWORD: ${EVALUATE_AMQP_PASSWORD:?Run npm run prepare:environment}
    volumes: ['./infra/rabbitmq/init.mjs:/init/init.mjs:ro']
    networks: [processor-broker]
    depends_on: {rabbitmq: {condition: service_healthy}}
    restart: 'no'
  resume-parser:
    <<: *processor
    image: ${PREPARE_IMAGE:-hr-dam-resume-parser:local}
    build:
      context: .
      dockerfile: infra/processing/Dockerfile
      args: {OPERATION: prepare}
    environment:
      <<: *processor-env
      PORT: 8001
      GUEST_AMQP_URL: amqp://hr_prepare:${PREPARE_AMQP_PASSWORD:?Run npm run prepare:environment}@rabbitmq:5672/hr-guest
      AUTHORIZED_AMQP_URL: amqp://hr_prepare:${PREPARE_AMQP_PASSWORD:?Run npm run prepare:environment}@rabbitmq:5672/hr-authorized
  resume-evaluator:
    <<: *processor
    image: ${EVALUATE_IMAGE:-hr-dam-resume-evaluator:local}
    build:
      context: .
      dockerfile: infra/processing/Dockerfile
      args: {OPERATION: evaluate}
    environment:
      <<: *processor-env
      PORT: 8002
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b-q4_K_M}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      RANK_TIMEOUT_SECONDS: ${RANK_TIMEOUT_SECONDS:-840}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      OLLAMA_MAX_TOKENS: ${OLLAMA_MAX_TOKENS:-8192}
      GUEST_AMQP_URL: amqp://hr_evaluate:${EVALUATE_AMQP_PASSWORD:?Run npm run prepare:environment}@rabbitmq:5672/hr-guest
      AUTHORIZED_AMQP_URL: amqp://hr_evaluate:${EVALUATE_AMQP_PASSWORD:?Run npm run prepare:environment}@rabbitmq:5672/hr-authorized
  postgres:
    <<: *service
    container_name: hr_dam-postgres
    image: postgres:16.13-alpine3.23
    command: [postgres, -c, timezone=Europe/Moscow, -c, log_timezone=Europe/Moscow]
    environment:
      <<: *timezone
      PGTZ: Europe/Moscow
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ['postgres_data:/var/lib/postgresql/data']
    networks: [database]
    healthcheck:
      <<: *health
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 5s
      retries: 20
      start_period: 10s
  flyway:
    <<: *service
    container_name: hr_dam-flyway
    image: flyway/flyway:12.1.0
    command: migrate
    environment:
      <<: *timezone
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      FLYWAY_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CLEAN_DISABLED: 'true'
      FLYWAY_BASELINE_ON_MIGRATE: 'false'
      FLYWAY_VALIDATE_MIGRATION_NAMING: 'true'
      REDGATE_DISABLE_TELEMETRY: 'true'
    volumes: ['./db/migrations:/flyway/sql:ro']
    networks: [database]
    depends_on: {postgres: {condition: service_healthy}}
    restart: 'no'
  seaweedfs:
    <<: *service
    container_name: hr_dam-seaweedfs
    image: hr-dam-seaweedfs:local
    build: {context: ., dockerfile: infra/seaweedfs/Dockerfile}
    command: [server, -dir=/data, -master.dir=/data, -ip=seaweedfs, -ip.bind=0.0.0.0, -master.volumeSizeLimitMB=1024, -volume.max=32, -filer, -s3, -s3.port=8333, -s3.iam=false, -s3.port.iceberg=0, -s3.allowDeleteBucketNotEmpty=false, -s3.config=/run/secrets/seaweed-s3]
    volumes: ['seaweedfs_data:/data', './infra/seaweedfs/filer.toml:/etc/seaweedfs/filer.toml:ro']
    networks: [guest-store, authorized-store]
    healthcheck:
      <<: *health
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8888/ && wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q ''HTTP/1.1 403''']
      interval: 5s
      retries: 30
    secrets: [seaweed-s3]
  s3-init:
    <<: *service
    container_name: hr_dam-s3-init
    image: amazon/aws-cli:2.27.49
    entrypoint: [/bin/sh, /init/bucket.sh]
    environment:
      <<: *timezone
      AWS_ACCESS_KEY_ID: ${S3_INIT_ACCESS_KEY:?Run npm run prepare:environment}
      AWS_SECRET_ACCESS_KEY: ${S3_INIT_SECRET_KEY:?Run npm run prepare:environment}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_PAGER: ''
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      S3_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://seaweedfs:8333}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
    volumes: ['./infra/s3/bucket.sh:/init/bucket.sh:ro']
    networks: [guest-store, authorized-store]
    depends_on: {seaweedfs: {condition: service_healthy}}
    restart: 'no'
  clamav:
    <<: *service
    container_name: hr_dam-clamav
    image: clamav/clamav:stable
    volumes: ['clamav_data:/var/lib/clamav']
    networks: [guest-antivirus, authorized-antivirus]
    healthcheck:
      <<: *health
      test: [CMD, clamdscan, --ping, '3']
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
  pgadmin:
    <<: *service
    container_name: hr_dam-pgadmin
    image: dpage/pgadmin4:9.18
    entrypoint: [/bin/sh, /config/start.sh]
    environment:
      <<: *timezone
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      PGADMIN_DISABLE_POSTFIX: 'true'
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    ports: ['${BIND_ADDRESS:-127.0.0.1}:${PGADMIN_PORT:-5050}:80']
    volumes: ['pgadmin_data:/var/lib/pgadmin', './infra/pgadmin/start.sh:/config/start.sh:ro']
    networks: [database]
    depends_on: {postgres: {condition: service_healthy}, flyway: {condition: service_completed_successfully}}
    healthcheck:
      <<: *health
      test: [CMD, /venv/bin/python3, -c, 'import urllib.request; urllib.request.urlopen(''http://127.0.0.1/misc/ping'', timeout=5)']
      timeout: 6s
      retries: 20
      start_period: 30s
    profiles: [administration]
  ollama:
    <<: *service
    container_name: hr_dam-ollama
    image: hr-dam-ollama:local
    build: {context: ., dockerfile: infra/ollama/Dockerfile}
    environment:
      <<: *timezone
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '16384'
      LLAMA_ARG_CACHE_RAM: ${OLLAMA_PROMPT_CACHE_MB:-1024}
    expose: ['11434']
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, count: 1, capabilities: [gpu]}
    volumes: ['ollama_data:/root/.ollama']
    networks: [model]
    healthcheck:
      <<: *health
      test: [CMD-SHELL, 'OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null']
    profiles: [docker-ollama]
  ollama-init:
    <<: *service
    container_name: hr_dam-ollama-init
    image: hr-dam-ollama:local
    pull_policy: never
    environment:
      <<: *timezone
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b-q4_K_M}
    entrypoint: [/bin/sh, /init/model.sh]
    volumes: ['./infra/ollama/model.sh:/init/model.sh:ro']
    networks: [model]
    depends_on: {ollama: {condition: service_healthy}}
    restart: on-failure
    profiles: [docker-ollama]
networks:
  frontend-guest: {internal: true}
  frontend-app: {internal: true}
  frontend-auth: {internal: true}
  database: {internal: true}
  guest-store: {internal: true}
  authorized-store: {internal: true}
  guest-broker: {internal: true}
  authorized-broker: {internal: true}
  processor-broker: {internal: true}
  guest-jobs: {internal: true}
  authorized-jobs: {internal: true}
  guest-antivirus: {}
  authorized-antivirus: {}
  model: {}
  edge: {}
volumes: {rabbitmq_data: {}, clamav_data: {}, postgres_data: {}, seaweedfs_data: {}, pgadmin_data: {}, ollama_data: {}}
secrets:
  auth-private: {file: .secrets/auth-private.pem}
  auth-public: {file: .secrets/auth-public.pem}
  guest-job-private: {file: .secrets/guest-job-private.pem}
  guest-job-public: {file: .secrets/guest-job-public.pem}
  authorized-job-private: {file: .secrets/authorized-job-private.pem}
  authorized-job-public: {file: .secrets/authorized-job-public.pem}
  guest-cookie-private: {file: .secrets/guest-cookie-private.pem}
  guest-cookie-public: {file: .secrets/guest-cookie-public.pem}
  seaweed-s3: {file: .secrets/seaweed-s3.json}
