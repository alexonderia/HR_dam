server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 51m;

    # Resolve Compose DNS again after an independent backend container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://backend:3001;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"service":"frontend"}';
    }

    location /api/ {
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-src 'self'; object-src 'self'" always;
    }
}
