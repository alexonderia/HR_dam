limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_rate:10m rate=5r/m;
map "$request_method:$uri" $allowed_route {
    default 0;
    ~^GET:/api/session$ 1;
    ~^POST:/api/auth/(login|logout|refresh)$ 1;
    ~^POST:/api/guest/(queue|tasks)$ 1;
    "~^GET:/api/guest/queue/[a-f0-9-]{36}$" 1;
    "~^GET:/api/guest/tasks/[a-f0-9-]{36}(/report|/download)?$" 1;
    "~^DELETE:/api/guest/tasks/[a-f0-9-]{36}$" 1;
    ~^GET:/api/app/(overview|analysis/status|processing/(mode|queue)|resume-imports(/status)?|export)$ 1;
    ~^POST:/api/app/(candidates|resume-imports|requirements/reassessment|clusters|profiles|blacklist|export)$ 1;
    "~^GET:/api/app/(resume-imports|files)/[a-f0-9-]{36}$" 1;
    "~^GET:/api/app/resumes/[a-f0-9-]{36}/(events|processing|report)$" 1;
    "~^POST:/api/app/resumes/[a-f0-9-]{36}/retry$" 1;
    "~^PATCH:/api/app/resumes/[a-f0-9-]{36}/status$" 1;
    "~^PUT:/api/app/(clusters|profiles|blacklist)/[a-f0-9-]{36}$" 1;
    "~^POST:/api/app/resume-imports/[a-f0-9-]{36}/items/[a-f0-9-]{36}/retry$" 1;
}
map $request_uri $ambiguous_path {
    default 0;
    ~^[^?]*(%|//|\.\.) 1;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 251m;
    client_body_timeout 60s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3001;
    set $guest http://guest-api:3002;
    set $auth http://auth-check:3004;
    if ($ambiguous_path) { return 404; }
    error_page 404 = @notfound;
    error_page 413 = @too_large;
    error_page 429 503 = @unavailable;
    error_page 401 = @unauthorized;
    error_page 403 = @forbidden;
    error_page 500 502 504 = @unavailable;
    location @notfound { default_type application/json; add_header Cache-Control no-store always; return 404 '{"error":"Маршрут не найден."}'; }
    location @too_large { default_type application/json; return 413 '{"error":"Превышен размер загрузки."}'; }
    location @unauthorized { default_type application/json; add_header Cache-Control no-store always; return 401 '{"error":"Требуется вход."}'; }
    location @forbidden { default_type application/json; add_header Cache-Control no-store always; return 403 '{"error":"Доступ запрещён."}'; }
    location @unavailable { default_type application/json; add_header Cache-Control no-store always; return 503 '{"error":"Сервис временно недоступен."}'; }
    location = /health { access_log off; default_type application/json; return 200 '{"ok":true,"service":"frontend"}'; }
    location = /__auth_guest {
        internal;
        proxy_pass $auth/verify;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Access-Policy guest;
        proxy_set_header Authorization "";
        proxy_set_header X-User-Id "";
        proxy_set_header X-Mode "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 3s;
    }
    location = /__auth_app {
        internal;
        proxy_pass $auth/verify;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Access-Policy authorized;
        proxy_set_header Authorization "";
        proxy_set_header X-User-Id "";
        proxy_set_header X-Mode "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 3s;
    }
    location = /api/session {
        if ($allowed_route = 0) { return 404; }
        include /etc/nginx/api-proxy.conf;
        proxy_pass $auth/session;
    }
    location = /api/auth/login {
        if ($allowed_route = 0) { return 404; }
        limit_req zone=login_rate burst=5 nodelay;
        include /etc/nginx/api-proxy.conf;
        proxy_pass $backend$request_uri;
    }
    location ~ ^/api/auth/(logout|refresh)$ {
        if ($allowed_route = 0) { return 404; }
        auth_request /__auth_app;
        include /etc/nginx/api-proxy.conf;
        proxy_pass $backend$request_uri;
    }
    location /api/guest/ {
        if ($allowed_route = 0) { return 404; }
        auth_request /__auth_guest;
        include /etc/nginx/api-proxy.conf;
        proxy_pass $guest$request_uri;
    }
    location /api/app/ {
        if ($allowed_route = 0) { return 404; }
        auth_request /__auth_app;
        include /etc/nginx/api-proxy.conf;
        proxy_pass $backend$request_uri;
    }
    location /api/ { default_type application/json; return 404 '{"error":"Маршрут API не найден."}'; }
    location = /api { default_type application/json; return 404 '{"error":"Маршрут API не найден."}'; }
    location /internal { return 404; }
    location /__ { return 404; }
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-src 'self'; object-src 'self'" always;
    }
}
